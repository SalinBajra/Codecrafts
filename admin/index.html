<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>CodeCrafts CMS</title>
  <link rel="icon" type="image/png" sizes="256x256" href="/assets/codecrafts-favicon.png">
  <link rel="apple-touch-icon" href="/assets/codecrafts-favicon.png">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <main class="login-view" id="login-view">
    <form class="login-card" id="login-form">
      <div class="admin-brand"><img src="/assets/codecrafts-mark-white.png" alt=""><span>CodeCrafts</span></div>
      <p class="eyebrow">Content management</p>
      <h1>Welcome back.</h1>
      <p>Sign in to edit and publish the CodeCrafts website.</p>
      <label>Admin password<input id="password" name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Open CMS</button>
      <p class="form-message" id="login-message" role="status"></p>
    </form>
  </main>

  <div class="cms-app" id="cms-app" hidden>
    <aside class="cms-sidebar">
      <a class="admin-brand" href="/" target="_blank" rel="noopener"><img src="/assets/codecrafts-mark-white.png" alt=""><span>CodeCrafts</span></a>
      <div class="sidebar-context">
        <p id="section-eyebrow">Website content</p>
        <div><strong id="section-title">General</strong><span class="save-state" id="save-state">Saved</span></div>
      </div>
      <nav id="cms-nav" aria-label="CMS sections"></nav>
      <div class="sidebar-bottom">
        <a href="/" target="_blank" rel="noopener">View website</a>
        <button type="button" id="logout-button">Sign out</button>
      </div>
    </aside>

    <main class="cms-main">
      <div class="cms-notice" id="cms-notice" hidden></div>
      <section class="editor" id="editor" aria-live="polite"></section>
      <div class="publish-area">
        <button class="mobile-preview-link" id="mobile-preview-button" type="button">Live preview</button>
        <button class="publish-button" id="publish-button" type="button" disabled>Publish changes</button>
      </div>
    </main>

    <section class="cms-preview" aria-label="Live website preview">
      <header class="preview-header">
        <div class="preview-status"><span aria-hidden="true"></span><div><strong>Click content to edit</strong><small>Select any highlighted text, image or section</small></div></div>
        <div class="preview-actions">
          <div class="preview-sizes" aria-label="Preview size">
            <button class="active" type="button" data-preview-size="desktop">Desktop</button>
            <button type="button" data-preview-size="tablet">Tablet</button>
            <button type="button" data-preview-size="mobile">Mobile</button>
          </div>
          <a id="open-preview" href="/" target="_blank" rel="noopener">Open page <span aria-hidden="true">↗</span></a>
          <button class="preview-close" id="preview-close" type="button" aria-label="Close live preview">Close</button>
        </div>
      </header>
      <div class="preview-canvas" data-preview-size="desktop">
        <iframe id="preview-frame" src="/" title="CodeCrafts live website preview"></iframe>
      </div>
    </section>
  </div>

  <template id="loading-template"><div class="loading"><span></span><p>Loading website content...</p></div></template>
  <script src="/admin/admin.js" defer></script>
</body>
</html>
